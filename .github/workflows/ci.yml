name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy tools/ --ignore-missing-imports || true

      - name: Run LMC validation
        run: |
          python tools/lmc-init.py --validate --base-path . || echo "Validation completed with notes"

  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON artifacts
        run: |
          python -c "
          import json
          from pathlib import Path
          errors = []
          for f in Path('.').rglob('*.json'):
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('JSON validation errors:')
              for e in errors:
                  print(e)
              exit(1)
          else:
              print('All JSON artifacts are valid.')
          "

      - name: Check for required LMC directories
        run: |
          REQUIRED_DIRS=("master-canon" "tools" "integration" "proof-of-process")
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Missing required directory: $dir"
              exit 1
            fi
          done
          echo "All required LMC directories present."